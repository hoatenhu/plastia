[package]
name = "plastia"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local-first automatic memory capture, recall and incremental consolidation for AI agents"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"

[dev-dependencies]
tempfile = "3.12"
